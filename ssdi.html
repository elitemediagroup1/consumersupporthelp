<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SSDI Evaluation – Consumer Support Help</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0b1220;
      --grad1:#0b1220cc;
      --grad2:#0b1220cc;
      --panel:#fffffff2;
      --text:#0f172a;
      --accent:#2dd4bf;
      --accent-700:#14b8a6;
      --border:rgba(15,23,42,.18);
      --hero:url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?q=80&w=1600&auto=format&fit=crop');
    }
    *{box-sizing:border-box;}
    body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;color:#e2e8f0;background:var(--bg);margin:0;}
    .hero{
      background:linear-gradient(180deg,var(--grad1),var(--grad2)),var(--hero) center/cover no-repeat;
      min-height:100vh;
      padding:60px 18px;
    }
    .container{
      max-width:640px;
      margin:0 auto;
      background:var(--panel);
      color:var(--text);
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
      padding:30px 24px;
    }
    h1,h2{font-family:Montserrat,sans-serif;margin-top:0;}
    h1{font-size:26px;color:#0f172a;margin-bottom:10px;}
    h2{font-size:22px;color:#0f172a;margin-bottom:12px;}
    p{color:#334155;font-size:15px;line-height:1.5;}
    label{font-weight:600;font-size:14px;display:block;margin-top:14px;color:#0f172a;}
    input,select{
      width:100%;
      padding:10px 12px;
      border:1px solid #cbd5e1;
      border-radius:10px;
      font-size:15px;
      background:#fff;
    }
    input:focus,select:focus{border-color:#99f6e4;box-shadow:0 0 0 3px #ccfbf1;outline:none;}
    button{
      margin-top:20px;
      width:100%;
      border:none;
      border-radius:10px;
      padding:12px 18px;
      font-weight:700;
      font-size:16px;
      background:var(--accent);
      color:#062a27;
      cursor:pointer;
      transition:background .15s,transform .1s;
      box-shadow:0 6px 14px rgba(20,184,166,.28);
    }
    button:hover{background:var(--accent-700);transform:translateY(-1px);}
    button:disabled{opacity:.6;cursor:not-allowed;}
    .cta{text-align:center;margin-top:24px;}
    .cta a{
      display:inline-block;
      background:var(--accent);
      color:#062a27;
      font-weight:700;
      padding:12px 20px;
      border-radius:10px;
      text-decoration:none;
      box-shadow:0 6px 14px rgba(20,184,166,.28);
    }
    .cta a:hover{background:var(--accent-700);}
  </style>
</head>
<body>

  <!-- Shared Header -->
  <div id="header"></div>

  <div class="hero">
    <div class="container">
      <h1>Do you feel that you qualify to receive SSDI Benefits?</h1>
      <p>If so, fill out your info below and request a call.</p>

      <form id="contactForm">
        <input type="hidden" name="formType" value="ssdi" />

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required />

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required />

        <label style="margin-top:18px; display:flex; align-items:flex-start; gap:8px; font-weight:500;">
          <input type="checkbox" id="consent" required style="margin-top:4px;">
          <span style="font-size:14px; color:#334155; line-height:1.4;">
            By checking this box, you agree to our
            <a href="privacy.html" target="_blank" style="color:#0f766e;">Privacy Policy</a> and
            <a href="terms.html" target="_blank" style="color:#0f766e;">Terms &amp; Conditions</a>,
            and consent to be contacted by phone, text, and email regarding your SSDI evaluation.
          </span>
        </label>

        <button type="submit">Request a Call</button>
      </form>
    </div>
  </div>

  <!-- Shared Footer -->
  <div id="footer"></div>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    const contactForm = document.getElementById('contactForm');

    contactForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      let phone = document.getElementById('phone').value.trim();
      const consentGiven = document.getElementById('consent').checked;

      if (!consentGiven) {
        alert("You must agree to the privacy policy and terms to continue.");
        return;
      }

      // Remove all non-digit characters
      phone = phone.replace(/\D/g, '');
      
      // If 10 digits (US number without '1'), prepend '1'
      if (phone.length === 10) {
        phone = '1' + phone;
      } 
      
      // Validate the final 11-digit US format (starts with '1')
      if (!(phone.length === 11 && phone.startsWith('1'))) {
        alert("Please enter a valid US phone number.");
        return;
      }

      // 💥 NEW LINE: Add the '+' prefix for E.164 compliance 
      phone = '+' + phone; 
      // Example: 19175551234 becomes +19175551234

      // ✅ Send as URL-encoded data, NOT FormData
      const contactData = new URLSearchParams();
      contactData.append('formType', 'ssdi');
      contactData.append('step', 'contact');
      contactData.append('leadId', 'lead-' + Date.now());
      contactData.append('name', name);
      contactData.append('email', email);
      contactData.append('phone', phone); // Now sends the +1... format
      contactData.append('consent', 'yes');

      fetch("https://script.google.com/macros/s/AKfycbxTeT-UznZKWb2fxR0w8oasR1D99OC79JWfOUL7VQC9LiAI2P25Xqfecc66qr6iBZC00w/exec", {
        method: "POST",
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: contactData.toString()
      })
      .then(response => response.text())
      .then(responseText => {
        if (responseText.includes("Success")) {
          alert("Thank you! We'll contact you shortly.");
          contactForm.reset();
        } else {
          alert("Submission failed: " + responseText);
        }
      })
      .catch(err => {
        alert("Network error. Please try again.");
        console.error(err);
      });
    });
  });
</script>

</body>
</html>
