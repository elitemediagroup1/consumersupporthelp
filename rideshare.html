  <style>
    .cs-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:80px 20px;background:linear-gradient(180deg,#f6fbfb 0%,#ffffff 100%);}
    .cs-card{max-width:680px;width:100%;text-align:center;background:#ffffff;border:1px solid #e6eef0;border-radius:18px;padding:56px 40px;box-shadow:0 10px 30px rgba(20,60,80,0.06);}

    .cs-btn-ghost{background:transparent;color:#1f8a8a;border:1.5px solid #1f8a8a;}
