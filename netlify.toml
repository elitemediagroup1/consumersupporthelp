[build]
publish = "."
functions = "netlify/functions"

[[plugins]]
package = "@netlify/plugin-functions-install-core"

[[plugins]]
package = "./netlify/plugins/fix-mojibake"

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "SAMEORIGIN"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/header.html"
[headers.values]
Content-Type = "text/html; charset=utf-8"
Cache-Control = "no-cache"

[[headers]]
for = "/footer.html"
[headers.values]
Content-Type = "text/html; charset=utf-8"
Cache-Control = "no-cache"

[[redirects]]
from = "/header.html"
to = "/header.html"
status = 200
force = true

[[redirects]]
from = "/footer.html"
to = "/footer.html"
status = 200
force = true

[[redirects]]
from = "https://www.consumersupporthelp.com/*"
to = "https://consumersupporthelp.com/:splat"
status = 301
force = true

[[redirects]]
from = "/home-insurance"
to = "/home-insurance/"
status = 301
force = false

[[redirects]]
from = "/home-insurance.html"
to = "/home-insurance/"
status = 301
force = false
